services:
  - type: web
    name: playto-payout-api
    runtime: python
    plan: free
    pythonVersion: 3.11
    region: oregon
    
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*.render.com,*.vercel.app,localhost"
      - key: DJANGO_SUPERUSER_PASSWORD
        scope: secret
      - key: DATABASE_URL
        fromDatabase:
          name: playto-payout-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: playto-payout-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: playto-payout-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: playto-payout-redis
          property: connectionString
    
    buildCommand: |
      cd backend && \
      pip install -r requirements.txt && \
      python manage.py collectstatic --noinput && \
      python manage.py migrate
    
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2

  - type: worker
    name: playto-payout-celery-worker
    runtime: python
    plan: free
    pythonVersion: 3.11
    region: oregon
    
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          name: playto-payout-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: playto-payout-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: playto-payout-db
          property: connectionString
      - key: DEBUG
        value: "False"
    
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && celery -A config worker --loglevel=info

  - type: pserv
    name: playto-payout-celery-beat
    runtime: python
    plan: free
    pythonVersion: 3.11
    region: oregon
    
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          name: playto-payout-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: playto-payout-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: playto-payout-db
          property: connectionString
      - key: DEBUG
        value: "False"
    
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

databases:
  - name: playto-payout-db
    engine: postgres
    plan: free
    version: "15"
    
  - name: playto-payout-redis
    engine: redis
    plan: free
    version: "7"
